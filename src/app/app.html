<div class="shell">
  <header class="masthead" [class.masthead--bare]="isAuthPage()">
    <a class="brand" routerLink="/">
      <span class="brand__mark">▌▐</span>
      <span class="brand__name">STAKEOUT</span>
    </a>

    @if (!isAuthPage()) {
      <nav class="nav">
        <a routerLink="/" routerLinkActive="on" [routerLinkActiveOptions]="{ exact: true }">Market</a>
        <a routerLink="/wallet" routerLinkActive="on">Wallet</a>
        <a routerLink="/profile" routerLinkActive="on">Profile</a>
      </nav>

      <div class="account">
        <a class="account__chip" routerLink="/profile">
          <span class="account__ava">{{ profile().displayName.charAt(0) }}</span>
          <span class="account__name">{{ profile().handle }}</span>
        </a>
        <button class="account__out" (click)="signOut()" aria-label="Sign out">Sign out</button>
      </div>
    }
  </header>

  <router-outlet />

  <footer class="demo-footer">
    <p>
      This is for demo purposes only; to be notified when we go live, join the waitlist
      -
      <a href="https://impravia.com.ng/" target="_blank" rel="noopener noreferrer">here</a>
    </p>
  </footer>
</div>
